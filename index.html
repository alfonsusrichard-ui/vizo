<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vizo - Web TV Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Desain Khusus Android TV / Fokus Navigasi */
        .channel-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }

        .channel-card:focus, .channel-card:hover {
            transform: scale(1.05);
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 12px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }

        .active-channel {
            background-color: #1e293b;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Header -->
    <header class="flex items-center justify-between mb-8 max-w-7xl mx-auto">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 p-2 rounded-lg">
                <i class="fas fa-tv text-xl"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tighter">VIZO</h1>
            <h2>Create by alfonsusrichardd</h2>
        </div>
        <div id="clock" class="text-lg font-medium opacity-70 hidden md:block"></div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Player Section -->
        <div class="lg:col-span-2">
            <div id="player-placeholder" class="video-container shadow-2xl">
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-6">
                    <i class="fas fa-play-circle text-6xl mb-4 text-blue-500 opacity-50"></i>
                    <p class="text-xl font-semibold">Pilih Saluran untuk Menonton</p>
                    <p class="opacity-50 text-sm mt-2">Gunakan remote atau mouse untuk memilih saluran di samping</p>
                </div>
            </div>
            
            <div id="channel-info" class="mt-4 hidden">
                <h2 id="current-title" class="text-2xl font-bold text-white">Saluran</h2>
                <div class="flex items-center gap-3 mt-2 text-sm text-blue-400">
                    <span class="px-2 py-1 bg-blue-900/30 rounded">LIVE</span>
                    <span id="current-category" class="text-slate-400 uppercase tracking-widest font-semibold">Entertainment</span>
                </div>
            </div>
        </div>

        <!-- Sidebar / Channel List -->
        <div class="space-y-4">
            <h3 class="text-lg font-semibold flex items-center gap-2 mb-4">
                <i class="fas fa-list-ul"></i> Daftar Saluran
            </h3>
            
            <div id="channel-list" class="grid grid-cols-1 gap-3 overflow-y-auto max-h-[600px] pr-2">
                <!-- Channels will be injected here -->
            </div>
        </div>
    </main>

    <footer class="max-w-7xl mx-auto mt-12 pt-8 border-t border-slate-800 text-center text-slate-500 text-sm">
        <p>&copy; 2026 Vizo Web Player TV. Ringan & Cepat.</p>
    </footer>

    <script>
        const channels = [
            {
                id: 1,
                name: "HBO Signature",
                url: "//cdn.stmify.com/embed-free/v1/hbo-signature-id-jw",
                category: "Movies",
                icon: "fa-film"
            },
            {
                id: 2,
                name: "HBO Hits",
                url: "//cdn.stmify.com/embed-free/v1/hbo-hits-id-jw",
                category: "Movies",
                icon: "fa-fire"
            },
            {
                id: 3,
                name: "HBO Family",
                url: "//cdn.stmify.com/embed-free/v1/hbo-family-id-jw",
                category: "Movies",
                icon: "fa-users"
            },
            {
                id: 4,
                name: "Rock Action",
                url: "//cdn.stmify.com/embed-free/v1/rock-action-sg-jw",
                category: "Movies",
                icon: "fa-bolt"
            },
            {
                id: 5,
                name: "Trans TV",
                url: "https://20.detik.com/watch/livestreaming-transtv",
                category: "Local TV",
                icon: "fa-broadcast-tower"
            },
            {
                id: 6,
                name: "Trans 7",
                url: "https://20.detik.com/watch/livestreaming-trans7",
                category: "Local TV",
                icon: "fa-broadcast-tower"
            }
        ];

        const channelListEl = document.getElementById('channel-list');
        const playerPlaceholder = document.getElementById('player-placeholder');
        const channelInfo = document.getElementById('channel-info');
        const currentTitle = document.getElementById('current-title');
        const currentCategory = document.getElementById('current-category');

        function initChannels() {
            channels.forEach(ch => {
                const button = document.createElement('button');
                button.className = "channel-card flex items-center p-4 bg-slate-800/50 rounded-xl text-left w-full hover:bg-slate-800";
                button.setAttribute('tabindex', '0'); // For TV Navigation
                
                button.innerHTML = `
                    <div class="w-12 h-12 bg-slate-700 rounded-lg flex items-center justify-center mr-4 text-blue-400">
                        <i class="fas ${ch.icon} text-xl"></i>
                    </div>
                    <div>
                        <div class="font-bold text-white">${ch.name}</div>
                        <div class="text-xs text-slate-400">${ch.category}</div>
                    </div>
                `;

                button.onclick = () => playChannel(ch, button);
                
                // Keyboard Support (Enter/Space for Android TV)
                button.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        playChannel(ch, button);
                    }
                };

                channelListEl.appendChild(button);
            });
        }

        function playChannel(channel, element) {
            // Update UI State
            document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active-channel'));
            element.classList.add('active-channel');

            // Load Iframe
            playerPlaceholder.innerHTML = `
                <iframe 
                    src="${channel.url}" 
                    allowfullscreen 
                    allow="autoplay; encrypted-media">
                </iframe>
            `;

            // Update Info
            channelInfo.classList.remove('hidden');
            currentTitle.innerText = channel.name;
            currentCategory.innerText = channel.category;

            // Scroll to top on mobile
            if (window.innerWidth < 1024) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Jam Real-time
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('clock').innerText = now.toLocaleDateString('id-ID', options);
        }

        window.onload = () => {
            initChannels();
            setInterval(updateClock, 1000);
            updateClock();
        };
    </script>
</body>
</html>
